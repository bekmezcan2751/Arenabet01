<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArenaBet</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#18294a 0,#080d18 42%);color:#f4f7fb;font-family:Arial,sans-serif}
button,input{font:inherit}
button{transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
button:active{transform:scale(.97)}
header{backdrop-filter:blur(12px)}
header{background:linear-gradient(135deg,#111a2d,#090d18);padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293955;position:sticky;top:0;z-index:10}
.logo{font-size:26px;font-weight:900;color:#f4c542}.logo span{color:#fff}.actions{display:flex;gap:7px;align-items:center}
.btn{border:1px solid #3b4d6c;background:#17233a;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.gold{background:#f4c542;color:#111;border:0;font-weight:800}
.container{max-width:950px;margin:auto;padding:16px 14px 115px}.notice{background:#131e32;border:1px solid #304362;border-radius:15px;padding:12px;color:#c8d2e2;font-size:13px;margin-bottom:18px}
h2{font-size:20px}.league{background:#101a2b;border:1px solid #293b59;border-radius:16px;overflow:hidden;margin:13px 0}.league-title{padding:12px 14px;background:#172239;color:#ccd6e5}
.match{padding:14px;border-top:1px solid #23324a}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:700}.teams span:last-child{text-align:right}.time{color:#94a3b8;font-weight:normal;font-size:12px}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.odd{background:#1a2941;border:1px solid #3a4d6c;border-radius:10px;padding:10px;text-align:center;cursor:pointer}.odd.active{border-color:#f4c542;background:#252b30}.odd small{display:block;color:#94a3b8}.odd b{color:#f4c542;font-size:17px}
.slip{position:fixed;bottom:0;left:0;right:0;background:#0e1728;border-top:1px solid #344763;padding:10px;z-index:12}.slipin{max-width:950px;margin:auto;display:flex;gap:9px;align-items:center}.slipinfo{flex:1;font-size:13px}.slipinfo b{color:#f4c542}.stake{width:100px;background:#17253d;color:#fff;border:1px solid #3a4d6c;padding:10px;border-radius:9px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:100%;max-width:420px;background:#101a2b;border:1px solid #344867;border-radius:16px;padding:20px}.box input{width:100%;margin:6px 0;background:#0a1220;color:#fff;border:1px solid #3a4d6c;padding:11px;border-radius:9px}.box .btn{margin-top:8px}
.panel{display:none;background:#101a2b;border:1px solid #304362;border-radius:16px;padding:16px;margin-bottom:18px}.panel.open{display:block}.history{border-bottom:1px solid #263750;padding:10px 0;font-size:13px}.muted{color:#9eacc0}

.slots{background:linear-gradient(145deg,#111d31,#0b1220);border:1px solid #344967;border-radius:20px;padding:16px;margin:18px 0;box-shadow:0 18px 50px #0005}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a2942,#0d1423);border:1px solid #405675;border-radius:16px;padding:12px;text-align:center;box-shadow:0 8px 25px #0004}
.slot-card:before{content:"";position:absolute;inset:-60px;background:radial-gradient(circle,#f4c54222,transparent 55%);pointer-events:none}
.slot-art{height:115px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:43px;background:radial-gradient(circle at 50% 35%,#4d4774,#17233a 58%,#0a101c);border:1px solid #5b6e8f;box-shadow:inset 0 0 25px #0008}
.slot-card h3{margin:11px 0 5px;font-size:17px}
.slot-card p{margin:0 0 11px;color:#aab7ca;font-size:12px}
.slot-card .btn{width:100%;box-shadow:0 5px 18px #f4c54233}
.slot-game{display:none;background:#0b1220;border:1px solid #3d5272;border-radius:18px;padding:14px;margin-top:15px}
.slot-game.open{display:block;animation:openGame .25s ease}
@keyframes openGame{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slot-machine{background:radial-gradient(circle at 50% 10%,#2c4267,#0a101d 65%);border:2px solid #5c739a;border-radius:22px;padding:16px;box-shadow:0 18px 55px #0009}
.slot-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot-brand{font-size:11px;letter-spacing:3px;color:#f4c542;font-weight:900}
.slot-top h3{margin:3px 0 0;font-size:23px}
.slot-jackpot{text-align:center;margin:14px 0;padding:11px;border-radius:13px;background:linear-gradient(90deg,#171f34,#38304e,#171f34);border:1px solid #75688f;color:#f4c542;font-weight:900;letter-spacing:1px;box-shadow:0 0 25px #f4c54216}
.slot-msg{text-align:center;color:#f4c542;font-weight:800;min-height:22px;margin:9px 0}
.reels{padding:10px;background:#050912;border:2px solid #526987;border-radius:16px;box-shadow:inset 0 0 28px #000;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.reel{height:76px;background:linear-gradient(180deg,#fff,#dce3eb 48%,#fff);color:#111;border:2px solid #a8b6c8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 10px #0007;transition:transform .15s ease}
.reel.spinning{animation:reelSpin .16s linear infinite}
@keyframes reelSpin{0%{transform:translateY(-4px);filter:blur(1px)}50%{transform:translateY(4px);filter:blur(2px)}100%{transform:translateY(-4px);filter:blur(1px)}}
.reel.win{animation:winPulse .55s infinite alternate}
@keyframes winPulse{from{transform:scale(1)}to{transform:scale(1.08);box-shadow:0 0 25px #f4c542}}
.payline{text-align:center;font-size:10px;color:#8fa1bc;margin:8px 0}
.slot-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-controls input{width:100px;background:#17253d;color:#fff;border:1px solid #526987;padding:10px;border-radius:9px;text-align:center}
.spin-main{min-width:125px;font-size:17px;padding:12px 18px}
.spin-main:disabled{opacity:.55;cursor:not-allowed}
.slot-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:13px}
.slot-bottom b{color:#f4c542}
.win-modal{display:none;position:fixed;inset:0;background:#000b;z-index:40;align-items:center;justify-content:center;padding:20px}
.win-modal.open{display:flex}
.win-box{width:100%;max-width:360px;text-align:center;background:radial-gradient(circle at 50% 0,#3b3153,#111a2d 60%);border:2px solid #f4c542;border-radius:22px;padding:28px;box-shadow:0 0 60px #f4c54255;animation:winBox .3s ease}
.win-icon{font-size:54px}
.win-title{font-size:25px;font-weight:900;color:#f4c542;margin:8px 0}
.win-amount{font-size:30px;font-weight:900;margin:8px 0 18px}
@keyframes winBox{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:600px){
 .slot-grid{grid-template-columns:1fr}
 .slot-art{height:92px}
 .slot-machine{padding:12px}
 .reel{height:64px;font-size:27px}
 .slot-controls{display:grid;grid-template-columns:45px 1fr 45px}
 .spin-main{grid-column:1/-1;width:100%}
}

@media(max-width:600px){header{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.logo{font-size:22px}.slipin{flex-wrap:wrap}.slipinfo{min-width:100%}.stake{flex:1}.slip .btn{flex:1}.odds{gap:5px}.odd{padding:9px 3px}}

.topup-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-box{position:relative;width:100%;max-width:430px;background:linear-gradient(145deg,#182840,#0d1525);border:1px solid #50678b;border-radius:20px;padding:22px;box-shadow:0 25px 70px #000b}
.modal-box h2{margin-top:0}
.modal-close{position:absolute;right:12px;top:10px;background:transparent;border:0;color:#fff;font-size:28px;cursor:pointer}
.modal-box label{display:block;margin:12px 0 6px;color:#b7c4d8;font-size:13px}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #4a607e;background:#101b2d;color:#fff;outline:none}
.input:focus{border-color:#f4c542}
@media(max-width:500px){.topup-options{grid-template-columns:1fr}}

</head>
<body>
<header>
<div class="logo">ARENA<span>BET</span></div>
<div class="actions">
<button class="btn" onclick="toggleProfile()">👤 <span id="userLabel">Oyuncu</span></button>
<button class="btn" onclick="openVerification()">🛡️ Profil Doğrulama</button>
<button class="btn gold" onclick="openTopup()">💳 Ödeme Bilgileri</button>
<button class="btn gold" onclick="openAuth()">Giriş / Kayıt</button>
</div>
</header>
<div class="container">
<div class="notice">ℹ️ <b>SANAL BAKİYE:</b> Bu sitedeki bakiye ve oyun sonuçları sanaldır; gerçek para işlemi yapılmaz.</div>

<div id="profile" class="panel">
<h2>👤 Kullanıcı Paneli</h2>
<div><b>Kullanıcı:</b> <span id="profileName">Oyuncu</span></div>
<div style="margin-top:7px"><b>Bakiye:</b> <span id="profileBalance">₺10.000,00</span></div>
<div style="margin-top:7px"><b>Doğrulama:</b> <span id="verificationStatus" class="muted">Bekliyor</span></div>
<h3>Kupon Geçmişi</h3><div id="history"><div class="muted">Henüz kupon yok.</div></div>
<button class="btn" onclick="resetDemo()">Hesabı sıfırla</button>
</div>



<section class="slots">
 <div class="slot-head">
 <div>
 <h2 style="margin:0">🎰 ARENA SLOTS</h2>
 <div class="muted" style="margin-top:4px">Özgün sanal slot oyunları</div>
 </div>
 <span class="muted">Bakiye</span>
 </div>

 <div class="slot-grid">
 <div class="slot-card">
 <div class="slot-art">⚡ 🏛️ ⚡</div>
 <h3>Olympus Fortune</h3>
 <p>Mitoloji esintili özgün slot</p>
 <button class="btn gold" onclick="openSlot('Olympus Fortune')">OYNA</button>
 </div>
 <div class="slot-card">
 <div class="slot-art">🍬 🍓 🍭</div>
 <h3>Sweet Kingdom</h3>
 <p>Şeker dünyasında bonus avı</p>
 <button class="btn gold" onclick="openSlot('Sweet Kingdom')">OYNA</button>
 </div>
 <div class="slot-card">
 <div class="slot-art">🎣 🐟 💰</div>
 <h3>Golden Catch</h3>
 <p>Balıkçılık temalı özgün slot</p>
 <button class="btn gold" onclick="openSlot('Golden Catch')">OYNA</button>
 </div>
 </div>

 <div id="slotGame" class="slot-game">
 <div class="slot-machine">
 <div class="slot-top">
 <div>
 <div class="slot-brand">ARENA SLOTS</div>
 <h3 id="slotTitle">Olympus Fortune</h3>
 </div>
 <button class="btn" onclick="closeSlot()">Kapat</button>
 </div>

 <div class="slot-jackpot">🏆 <span id="slotJackpot">BÜYÜK KAZANÇ</span> 🏆</div>
 <div class="slot-msg" id="slotMsg">Bahsini seç ve SPIN'e bas.</div>

 <div class="reels" id="reels"></div>

 <div class="payline">⭐ ORTA SATIR ÖDÜL HATTI ⭐</div>

 <div class="slot-controls">
 <button class="btn" onclick="changeSlotBet(-10)">−</button>
 <input id="slotBet" type="number" min="10" step="10" value="100">
 <button class="btn" onclick="changeSlotBet(10)">+</button>
 <button class="btn gold spin-main" onclick="spinSlot()">SPIN</button>
 </div>

 <div class="slot-bottom">
 <span>💰 Bakiye: <b id="slotBalance">₺10.000,00</b></span>
 <button class="btn" onclick="resetDemo()">↻ Sıfırla</button>
 </div>
 </div>
 </div>
</section>

<h2>⚽ Bugünün Maçları</h2>
<div class="league"><div class="league-title">🇹🇷 Süper Lig • Örnek Karşılaşmalar</div>
<div class="match"><div class="teams"><span>İstanbul FC</span><span class="time">20:00</span><span>Anadolu SK</span></div><div class="odds">
<div class="odd" onclick="pick(this,'İstanbul FC','1',1.85)"><small>MS 1</small><b>1.85</b></div><div class="odd" onclick="pick(this,'İstanbul FC - Anadolu SK','X',3.40)"><small>MS X</small><b>3.40</b></div><div class="odd" onclick="pick(this,'Anadolu SK','2',3.10)"><small>MS 2</small><b>3.10</b></div></div></div>
<div class="match"><div class="teams"><span>Akdenizspor</span><span class="time">22:00</span><span>Başkent FK</span></div><div class="odds">
<div class="odd" onclick="pick(this,'Akdenizspor','1',2.05)"><small>MS 1</small><b>2.05</b></div><div class="odd" onclick="pick(this,'Akdenizspor - Başkent FK','X',3.20)"><small>MS X</small><b>3.20</b></div><div class="odd" onclick="pick(this,'Başkent FK','2',2.75)"><small>MS 2</small><b>2.75</b></div></div></div></div>
<div class="league"><div class="league-title">🌍 Avrupa Ligi • Örnek Karşılaşmalar</div>
<div class="match"><div class="teams"><span>Madrid United</span><span class="time">21:45</span><span>Roma City</span></div><div class="odds">
<div class="odd" onclick="pick(this,'Madrid United','1',1.60)"><small>MS 1</small><b>1.60</b></div><div class="odd" onclick="pick(this,'Madrid United - Roma City','X',4.00)"><small>MS X</small><b>4.00</b></div><div class="odd" onclick="pick(this,'Roma City','2',4.80)"><small>MS 2</small><b>4.80</b></div></div></div></div>
</div>

<div class="slip"><div class="slipin"><div class="slipinfo" id="selection"><b>Kupon:</b> Seçim yapılmadı</div><input id="stake" class="stake" type="number" min="1" value="100"><button class="btn" onclick="clearSlip()">Temizle</button><button class="btn gold" onclick="placeBet()">Kuponu Oyna</button></div></div>

<div id="winModal" class="win-modal">
 <div class="win-box">
 <div class="win-icon">🎉</div>
 <div class="win-title">BÜYÜK KAZANÇ!</div>
 <div class="win-amount" id="winAmount">₺0,00</div>
 <div class="muted" id="winDetail">Kazanç</div>
 <button class="btn gold" style="width:100%;margin-top:18px" onclick="closeWin()">DEVAM ET</button>
 </div>
</div>


<div id="topupModal" class="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeTopup()">×</button>
    <h2>💳 Ödeme Bilgileri</h2>
    <p class="muted">Bu bölüm yalnızca sanal bakiye içindir. Gerçek para veya ödeme alınmaz.</p>
    <div style="background:#101b2d;border:1px solid #4a607e;border-radius:12px;padding:14px;margin-top:15px">
      <div class="muted" style="font-size:12px">ÖRNEK IBAN</div>
      <div style="font-weight:800;letter-spacing:1px;margin-top:6px;word-break:break-all">TR00 0000 0000 0000 0000 0000 00</div>
      <div class="muted" style="margin-top:10px">Bu bilgi yalnızca arayüz örneğidir. Gerçek para transferi veya ödeme işlemi yapılmaz.</div>
    </div>
  </div>
</div>

<div id="verificationModal" class="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeVerification()">×</button>
    <h2>🛡️ Profil Doğrulama</h2>
    <p class="muted">Güvenli demo doğrulaması. TC kimlik, banka kartı, açık adres veya başka hassas bilgi istemez.</p>
    <label>Ad Soyad</label>
    <input id="verifyName" class="input" maxlength="60" placeholder="Ad Soyad">
    <label>E-posta</label>
    <input id="verifyEmail" class="input" type="email" maxlength="100" placeholder="ornek@mail.com">
    <label>TC Kimlik No</label>
    <input id="verifyTc" class="input" inputmode="numeric" maxlength="11" placeholder="***********">
    <small class="muted">Gerçek TC numarası kaydedilmez; yalnızca doğrulama ekranı simülasyonudur.</small>
    <label>Telefon (opsiyonel)</label>
    <input id="verifyPhone" class="input" maxlength="20" placeholder="05xx xxx xx xx">
    <button class="btn gold" style="width:100%;margin-top:14px" onclick="submitVerification()">Doğrulamayı Başlat</button>
    <div id="verifyMsg" class="muted" style="margin-top:12px"></div>
  </div>
</div>

<div id="auth" class="modal"><div class="box"><h2 id="authTitle">Giriş / Kayıt</h2><input id="username" placeholder="Kullanıcı adı"><input id="password" type="password" placeholder="Şifre"><button class="btn gold" style="width:100%" onclick="login()">Hesap Oluştur / Giriş Yap</button><button class="btn" style="width:100%" onclick="closeAuth()">Kapat</button><p class="muted">Bu bilgiler yalnızca bu tarayıcıda saklanır.</p></div></div>

<script>
let data=JSON.parse(localStorage.getItem('arenabetDemo')||'null')||{name:'Oyuncu',balance:10000,history:[]};let selected=null;
function save(){localStorage.setItem('arenabetDemo',JSON.stringify(data));render()}
function money(n){return '₺'+n.toLocaleString('tr-TR',{minimumFractionDigits:2})}
function render(){document.getElementById('userLabel').textContent=data.name;document.getElementById('profileName').textContent=data.name;document.getElementById('profileBalance').textContent=money(data.balance);document.getElementById('history').innerHTML=data.history.length?data.history.slice().reverse().map(x=>`<div class="history"><b>${x.pick}</b> @ ${x.odd}<br><span class="muted">${money(x.stake)} • ${x.status} • ${x.date}</span></div>`).join(''):'<div class="muted">Henüz kupon yok.</div>';update()}
function toggleProfile(){document.getElementById('profile').classList.toggle('open')}
function openAuth(){document.getElementById('auth').classList.add('open')}
function closeAuth(){document.getElementById('auth').classList.remove('open')}
function login(){let n=document.getElementById('username').value.trim();if(!n)return alert('Kullanıcı adı girin.');data.name=n;save();closeAuth()}
function pick(el,name,type,odd){document.querySelectorAll('.odd').forEach(x=>x.classList.remove('active'));el.classList.add('active');selected={name,type,odd};update()}
function update(){let s=Number(document.getElementById('stake').value)||0;if(!selected){document.getElementById('selection').innerHTML='<b>Kupon:</b> Seçim yapılmadı';return}document.getElementById('selection').innerHTML=`<b>${selected.name} • MS ${selected.type} @ ${selected.odd}</b><br>Potansiyel sanal kazanç: ${money(s*selected.odd)}`}
document.getElementById('stake').addEventListener('input',update);
function clearSlip(){selected=null;document.querySelectorAll('.odd').forEach(x=>x.classList.remove('active'));update()}
function placeBet(){let s=Number(document.getElementById('stake').value)||0;if(!selected)return alert('Önce bir seçim yapın.');if(s<=0||s>data.balance)return alert('Geçerli bir sanal tutar girin.');data.balance-=s;data.history.push({pick:selected.name+' • MS '+selected.type,odd:selected.odd,stake:s,status:'Bekliyor',date:new Date().toLocaleString('tr-TR')});save();alert('Kupon oluşturuldu. Bakiye sanaldır; gerçek para kullanılmaz.');clearSlip()}
function resetDemo(){
 data.balance=10000;
 data.history=[];
 save();
 if(document.getElementById('slotBalance')) document.getElementById('slotBalance').textContent=money(data.balance);
 if(document.getElementById('slotMsg')) document.getElementById('slotMsg').textContent='💰 Bakiye 10.000 sanal olarak sıfırlandı.';
 alert('Bakiye 10.000 sanal olarak yenilendi.');
}

let currentSlot='';
const slotSymbols={
 'Olympus Fortune':['⚡','👑','💎','🏛️','☀️','🌩️'],
 'Sweet Kingdom':['🍭','🍬','🍓','🍋','🍇','🍒'],
 'Golden Catch':['🎣','🐟','🦈','💰','🪙','🎯']
};
function openSlot(name){
 currentSlot=name;
 document.getElementById('slotTitle').textContent=name;
 document.getElementById('slotGame').classList.add('open');
 document.getElementById('slotMsg').textContent='Bahsini seç ve SPIN\'e bas.';
 document.getElementById('slotJackpot').textContent='BÜYÜK KAZANÇ';
 makeReels();
 document.getElementById('slotBalance').textContent=money(data.balance);
}
function closeSlot(){document.getElementById('slotGame').classList.remove('open')}
function changeSlotBet(delta){
 const input=document.getElementById('slotBet');
 input.value=Math.max(10,Number(input.value||100)+delta);
}
function makeReels(){
 const box=document.getElementById('reels');
 const a=slotSymbols[currentSlot]||slotSymbols['Olympus Fortune'];
 box.innerHTML='';
 for(let i=0;i<15;i++){
 const d=document.createElement('div');
 d.className='reel';
 d.textContent=a[Math.floor(Math.random()*a.length)];
 box.appendChild(d);
 }
}
let slotSpins=0;
let spinning=false;
function spinSlot(){
 if(!currentSlot || spinning)return;
 const bet=Number(document.getElementById('slotBet').value)||0;
 if(bet<=0||bet>data.balance){alert('Geçerli bir sanal bahis tutarı girin.');return}

 spinning=true;
 const spinBtn=document.querySelector('.spin-main');
 spinBtn.disabled=true;
 data.balance-=bet;
 document.getElementById('slotBalance').textContent=money(data.balance);
 document.getElementById('slotMsg').textContent='🎰 Dönen makaralar...';
 document.getElementById('slotJackpot').textContent='✨ ŞANSINI DENE ✨';

 const a=slotSymbols[currentSlot];
 const box=document.getElementById('reels');
 box.innerHTML='';
 for(let i=0;i<15;i++){
 const d=document.createElement('div');
 d.className='reel spinning';
 d.textContent=a[Math.floor(Math.random()*a.length)];
 box.appendChild(d);
 }

 setTimeout(()=>{
 const cells=[];
 for(let i=0;i<15;i++)cells.push(a[Math.floor(Math.random()*a.length)]);

 const r=Math.random();
 let multiplier=0;
 if(r<0.45) multiplier=1.5;
 else if(r<0.70) multiplier=2;
 else if(r<0.78) multiplier=3;
 else if(r<0.80) multiplier=10;

 let win=0;
 if(multiplier>0){
 const symbol=a[Math.floor(Math.random()*a.length)];
 const row=cells.slice(5,10);
 row[0]=symbol; row[1]=symbol; row[2]=symbol;
 if(multiplier>=2) row[3]=symbol;
 if(multiplier>=3) row[4]=symbol;
 if(multiplier>=10) row[0]=row[1]=row[2]=row[3]=row[4]=symbol;
 cells.splice(5,5,...row);
 win=bet*multiplier;
 data.balance+=win;
 }

 box.innerHTML=cells.map((x,i)=>`<div class="reel ${win&&i>=5&&i<=9?'win':''}">${x}</div>`).join('');
 document.getElementById('slotMsg').textContent=win
 ? `🎉 KAZANDIN: ${money(win)} • ${multiplier}x`
 : 'Bu tur kazanç yok.';
 document.getElementById('slotBalance').textContent=money(data.balance);
 document.getElementById('slotJackpot').textContent=win>=bet*10?'🔥 MEGA KAZANÇ 🔥':(win?'🏆 BÜYÜK KAZANÇ 🏆':'✨ ŞANSINI DENE ✨');
 save();

 if(win>=bet*3){
 document.getElementById('winAmount').textContent=money(win);
 document.getElementById('winDetail').textContent=`${multiplier}x sanal ödül • ${currentSlot}`;
 document.getElementById('winModal').classList.add('open');
 }

 spinning=false;
 spinBtn.disabled=false;
 },900);
}

function openTopup(){
  document.getElementById('topupModal').classList.add('open');
}
function closeTopup(){document.getElementById('topupModal').classList.remove('open')}

function openVerification(){
  document.getElementById('verificationModal').classList.add('open');
}
function closeVerification(){document.getElementById('verificationModal').classList.remove('open')}
function submitVerification(){
  const name=document.getElementById('verifyName').value.trim();
  const email=document.getElementById('verifyEmail').value.trim();
  const tc=document.getElementById('verifyTc').value.replace(/\\D/g,'');
  if(name.length<2 || !email.includes('@') || tc.length!==11){
    document.getElementById('verifyMsg').textContent='Lütfen ad soyad, geçerli e-posta ve 11 haneli TC alanını doldurun.';
    return;
  }
  // TC number is intentionally NOT stored.
  document.getElementById('verifyTc').value='***********';
  localStorage.setItem('arenaProfileVerified','1');
  document.getElementById('verifyMsg').textContent='✓ Profil doğrulama simülasyonu tamamlandı. TC numarası kaydedilmedi.';
  const vs=document.getElementById('verificationStatus'); if(vs) vs.textContent='✓ Doğrulandı';
}

function closeWin(){document.getElementById('winModal').classList.remove('open')}

function refillDemoBalance(){
 data.balance+=10000;
 document.getElementById('slotBalance').textContent=money(data.balance);
 save();
 document.getElementById('slotMsg').textContent='💰 10.000 sanal bakiye eklendi.';
}

render();
